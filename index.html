<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoundBox — Real Internet Sounds</title><style>:root{--bg:#090b12;--card:#121622;--line:#2a3142;--txt:#f7f8fc;--muted:#9aa4b5;--a:#8b5cf6;--b:#22d3ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#25134d,transparent 35%),radial-gradient(circle at 90% 15%,#063b48,transparent 28%),var(--bg);color:var(--txt);font-family:system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:28px 18px 55px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,var(--a),var(--b));font-size:25px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.15em;color:#bca9ff;text-transform:uppercase}.hero h1{font-size:clamp(32px,6vw,54px);line-height:1;margin:5px 0}.hero p{color:var(--muted)}.toolbar{position:sticky;top:8px;z-index:5;display:flex;gap:9px;flex-wrap:wrap;padding:11px;background:#0e1119ee;backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:17px}.search{flex:1;min-width:220px}.search input,.tool{height:43px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--txt);outline:0}.search input{width:100%;padding:0 14px}.tool{padding:0 13px;cursor:pointer}.tool:hover,.tool.active{border-color:var(--a);background:#281d43}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:18px}.card{position:relative;padding:15px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,var(--card),#0e1119)}.name{font-weight:750;padding-right:30px;margin-bottom:5px}.meta,.source{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card audio{width:100%;margin-top:12px}.fav{position:absolute;right:9px;top:8px;border:0;background:none;color:#697386;font-size:20px;cursor:pointer}.fav.on{color:#facc15}.status{text-align:center;color:var(--muted);padding:25px}.source{margin-top:7px}.source a{color:#aeb8c9}.load{display:block;margin:20px auto;padding:12px 18px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--txt);cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="hero"><div class="brand"><div class="logo">🔊</div><div><div class="eyebrow">SoundBox</div><h1>Press. Hear. Chaos.</h1></div></div><p>Real sounds from the internet, powered by SFXMint.</p></header><section class="toolbar"><div class="search"><input id="q" value="funny sound" placeholder="Search: fart, laser, meme..."></div><button class="tool" id="go">🔎 Search</button><button class="tool" id="fav">★ Favorites</button><button class="tool" id="random">🎲 Random</button></section><div id="status" class="status">Loading real sounds…</div><main id="grid" class="grid"></main><button id="load" class="load" hidden>Load more</button><div class="status">Audio is loaded from SFXMint. Its library is CC0, so the sounds can be used commercially without attribution.</div></div><script>const grid=document.getElementById('grid'),status=document.getElementById('status'),load=document.getElementById('load'),q=document.getElementById('q');let page=1,query='funny sound',items=[],onlyFav=false;let favs=new Set(JSON.parse(localStorage.getItem('soundbox-favs')||'[]'));function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('soundbox-favs',JSON.stringify([...favs]))}function draw(){grid.innerHTML='';const shown=onlyFav?items.filter(x=>favs.has(x.id)):items;shown.forEach(s=>{const e=document.createElement('article');e.className='card';e.dataset.id=s.id;e.innerHTML='<button class="fav '+(favs.has(s.id)?'on':'')+'">★</button><div class="name">'+esc(s.name)+'</div><div class="meta">by '+esc(s.creator)+' · '+Number(s.duration||0).toFixed(1)+'s</div><audio controls preload="none" src="'+esc(s.preview)+'"></audio><div class="source"><a target="_blank" rel="noopener" href="'+esc(s.source)+'">View on SFXMint</a> · '+esc(s.license)+'</div>';e.querySelector('.fav').onclick=()=>{favs.has(s.id)?favs.delete(s.id):favs.add(s.id);save();draw()};grid.appendChild(e)})}async function search(reset=true){if(reset){page=1;items=[];grid.innerHTML=''}onlyFav=false;document.getElementById('fav').classList.remove('active');status.hidden=false;status.textContent='Loading real sounds…';load.hidden=true;try{const r=await fetch('/api/sounds?q='+encodeURIComponent(query)+'&page='+page);const d=await r.json();if(!r.ok)throw Error(d.error||'API error');items.push(...d.results);draw();status.textContent=d.count.toLocaleString()+' sounds found';load.hidden=d.results.length===0}catch(e){status.textContent='Could not load sounds: '+e.message}}document.getElementById('go').onclick=()=>{query=q.value.trim()||'funny sound';search()};q.onkeydown=e=>{if(e.key==='Enter'){query=q.value.trim()||'funny sound';search()}};load.onclick=()=>{page++;search(false)};document.getElementById('fav').onclick=()=>{onlyFav=!onlyFav;document.getElementById('fav').classList.toggle('active',onlyFav);draw()};document.getElementById('random').onclick=()=>{const a=[...grid.querySelectorAll('audio')];if(a.length)a[Math.floor(Math.random()*a.length)].play()};search();</script></body></html>
