<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArcadeHub — Modern Browser Games</title>
<style>
:root{--bg:#060912;--panel:#0d1422;--panel2:#111b2d;--line:#22314a;--text:#f7f9ff;--muted:#8fa1bb;--a:#7c5cff;--b:#22d3ee}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1c2750 0,transparent 30%),radial-gradient(circle at 90% 15%,#2b1451 0,transparent 25%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
.wrap{max-width:1240px;margin:auto;padding:22px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:950;letter-spacing:-.04em}.brand span{color:var(--b)}.status{font-size:12px;color:#aab8cc;border:1px solid var(--line);background:#0c1320cc;padding:8px 11px;border-radius:999px}
.hero{padding:58px 0 30px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:900;color:#a99cff}.hero h1{font-size:clamp(42px,7vw,78px);line-height:.94;letter-spacing:-.055em;margin:9px 0 16px}.hero p{max-width:680px;color:var(--muted);font-size:17px;line-height:1.6}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;position:sticky;top:10px;z-index:5;padding:10px;border:1px solid var(--line);background:#09101ddd;backdrop-filter:blur(16px);border-radius:15px}.toolbar input,.toolbar button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 13px}.toolbar input{flex:1;min-width:220px;outline:none}.toolbar button{cursor:pointer}.toolbar button:hover,.toolbar button.active{border-color:var(--a);background:#211a40}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:15px;margin-top:18px}.game{min-height:235px;border:1px solid var(--line);border-radius:19px;padding:18px;background:linear-gradient(145deg,#101a2b,#0a111d);display:flex;flex-direction:column;overflow:hidden;position:relative}.game:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 0,#7c5cff14,transparent 45%);pointer-events:none}.icon{font-size:42px}.game h2{font-size:20px;margin:10px 0 5px}.game p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 15px}.meta{font-size:11px;color:#7386a1;margin-bottom:12px}.play{margin-top:auto;border:0;border-radius:11px;padding:11px 13px;background:linear-gradient(135deg,var(--a),#4f8cff);color:white;font-weight:850;cursor:pointer}.play.external{background:linear-gradient(135deg,#16b6d3,#2563eb)}
.foot{text-align:center;color:#65758c;font-size:12px;padding-top:35px}
#modal{display:none;position:fixed;inset:0;background:#02040bd9;z-index:20;padding:14px;align-items:center;justify-content:center}.box{width:min(850px,100%);max-height:94vh;overflow:auto;background:#0b1320;border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;box-shadow:0 25px 80px #0008}.close{position:absolute;right:13px;top:12px;background:#172235;color:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}.stage{min-height:390px;display:grid;place-items:center;margin-top:14px}.stage canvas{max-width:100%;height:auto;border:1px solid #243650;border-radius:13px;background:#050a12;touch-action:none}.hint{color:var(--muted);font-size:13px}.score{font-size:18px;margin:0 0 10px}.small{background:#172438;color:white;border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer}
@media(max-width:600px){.hero{padding-top:38px}.hero h1{font-size:48px}.grid{grid-template-columns:1fr}.stage{min-height:320px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">Arcade<span>Hub</span></div><div class="status">10 modern browser games</div></header>
<section class="hero"><div class="tag">Modern web arcade</div><h1>Play something<br>actually fun.</h1><p>Fast, polished browser games built into the site. No downloads, accounts, or old-school filler.</p></section>
<section class="toolbar"><input id="search" placeholder="Search games…"><button class="active" data-cat="all">All</button><button data-cat="3d">3D / Action</button><button data-cat="arcade">Arcade</button><button data-cat="puzzle">Puzzle</button></section>
<main id="grid" class="grid"></main><div class="foot">ArcadeHub • Play during appropriate breaks and free time.</div>
</div>
<div id="modal"><div class="box"><button class="close" onclick="closeGame()">Close</button><h2 id="title"></h2><div id="stage" class="stage"></div></div></div>
<script>
const games=[
['minecraft','⛏️','Minecraft Classic','3d','The original browser Minecraft experience. Open the official Classic Minecraft game.','external'],
['slope','🟣','Slope Run','3d','Roll through a neon 3D tunnel, dodge obstacles and survive as long as possible.'],
['geometry','🔺','Geometry Jump','arcade','Jump over spikes and keep your cube alive. One-button controls.'],
['highway','🏎️','Neon Highway','3d','Dodge traffic on an endless neon highway and chase a high score.'],
['aim','🎯','Aim Trainer','arcade','Targets appear at random positions. Test your speed and accuracy.'],
['block','🧱','Block Blast','puzzle','Place blocks on a grid and clear complete rows and columns.'],
['golf','⛳','Mini Golf','arcade','Aim, charge and putt through a compact obstacle course.'],
['drift','🚗','Drift Arena','3d','Drive around an arena, collect checkpoints and beat the clock.'],
['switch','🌈','Color Switch','arcade','Pass through matching colors and react before the next gate.'],
['stack','🏗️','Tower Stack','arcade','Drop moving platforms and build the highest tower you can.']
];
const grid=document.getElementById('grid'),search=document.getElementById('search');let cat='all',timer=null;
function draw(){const q=search.value.toLowerCase();grid.innerHTML=games.filter(g=>(cat==='all'||g[3]===cat)&&(g[2]+' '+g[4]).toLowerCase().includes(q)).map(g=>'<article class="game"><div class="icon">'+g[1]+'</div><h2>'+g[2]+'</h2><p>'+g[4]+'</p><div class="meta">'+(g[5]?'OFFICIAL WEB GAME':'BUILT-IN • NO DOWNLOAD')+'</div><button class="play '+(g[5]?'external':'')+'" onclick="openGame(\''+g[0]+'\',\''+g[2]+'\')">'+(g[5]?'Open Game →':'Play Now')+'</button></article>').join('')}
search.oninput=draw;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()});draw();
const modal=document.getElementById('modal'),stage=document.getElementById('stage'),title=document.getElementById('title');
function openGame(id,t){clearInterval(timer);title.textContent=t;stage.innerHTML='';if(id==='minecraft'){window.open('https://classic.minecraft.net/','_blank','noopener');return}modal.style.display='flex';({slope,geometry,highway,aim,block,golf,drift,switcher,stack}[id])()}
function closeGame(){clearInterval(timer);modal.style.display='none';document.onkeydown=null}
function canvas(w,h){stage.innerHTML='<div><div class="score" id="score">Score: 0</div><canvas width="'+w+'" height="'+h+'"></canvas><p class="hint">Use keyboard, mouse or touch controls. Press R to restart.</p></div>';return stage.querySelector('canvas')}
function keysGame(handler){document.onkeydown=e=>{handler(e);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)||e.key.startsWith('Arrow'))e.preventDefault()}}
function slope(){const c=canvas(520,420),x=c.getContext('2d');let px=260,py=340,vx=0,vy=0,s=0,alive=true,obs=[];for(let i=0;i<12;i++)obs.push({x:80+Math.random()*360,y:350-i*120,w:35+Math.random()*35});function reset(){px=260;py=340;vx=0;vy=0;s=0;alive=true;obs=[];for(let i=0;i<12;i++)obs.push({x:80+Math.random()*360,y:350-i*120,w:35+Math.random()*35})}keysGame(e=>{if(e.key.toLowerCase()==='r')reset();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')vx=-4;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')vx=4});c.ontouchstart=e=>{vx=e.touches[0].clientX<c.getBoundingClientRect().left+c.clientWidth/2?-4:4};timer=setInterval(()=>{if(!alive)return;px+=vx;vx*=.9;py-=2.2;if(py<160)py=160;obs.forEach(o=>{o.y+=2.2;if(o.y>440){o.y-=1440;o.x=60+Math.random()*400;s++}if(Math.abs(px-o.x)<30+o.w/2&&Math.abs(py-o.y)<22){alive=false}});if(px<20||px>500)alive=false;document.getElementById('score').textContent='Distance: '+s+(alive?'':' • Game over — press R');x.fillStyle='#07101e';x.fillRect(0,0,520,420);x.fillStyle='#16263d';x.beginPath();x.moveTo(90,0);x.lineTo(430,0);x.lineTo(500,420);x.lineTo(20,420);x.fill();x.fillStyle='#7c5cff';obs.forEach(o=>x.fillRect(o.x-o.w/2,o.y,o.w,22));x.fillStyle='#22d3ee';x.beginPath();x.arc(px,py,14,0,7);x.fill()},30)}
function geometry(){const c=canvas(640,330),x=c.getContext('2d');let y=270,vy=0,t=0,score=0,alive=true,spikes=[];for(let i=0;i<10;i++)spikes.push({x:500+i*150});function reset(){y=270;vy=0;t=0;score=0;alive=true;spikes=[];for(let i=0;i<10;i++)spikes.push({x:500+i*150})}function jump(){if(y>=268){vy=-9}}c.onclick=jump;keysGame(e=>{if(e.code==='Space'||e.key==='ArrowUp')jump();if(e.key.toLowerCase()==='r')reset()});timer=setInterval(()=>{if(!alive)return;vy+=.45;y+=vy;spikes.forEach(s=>s.x-=5);if(spikes[0].x<-30){spikes.shift();spikes.push({x:spikes[spikes.length-1].x+150});score++}if(y>285){y=270;vy=0}spikes.forEach(s=>{if(Math.abs(s.x-100)<22&&y>235)alive=false});document.getElementById('score').textContent='Score: '+score+(alive?'':' • Game over — press R');x.fillStyle='#070d18';x.fillRect(0,0,640,330);x.fillStyle='#18283e';x.fillRect(0,285,640,45);x.fillStyle='#7c5cff';spikes.forEach(s=>{x.beginPath();x.moveTo(s.x,285);x.lineTo(s.x+18,250);x.lineTo(s.x+36,285);x.fill()});x.save();x.translate(100,y);x.rotate(t*.1);x.fillStyle='#22d3ee';x.fillRect(-15,-15,30,30);x.restore();t++},16)}
function highway(){const c=canvas(520,420),x=c.getContext('2d');let px=260,score=0,speed=4,cars=[];for(let i=0;i<6;i++)cars.push({x:150+Math.random()*220,y:-i*120-60});keysGame(e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')px-=18;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')px+=18;if(e.key.toLowerCase()==='r'){score=0;cars.forEach((a,i)=>a.y=-i*120-60)}});timer=setInterval(()=>{px=Math.max(165,Math.min(355,px));cars.forEach(a=>{a.y+=speed;if(a.y>450){a.y=-50; a.x=155+Math.random()*210;score++;speed=Math.min(9,speed+.02)}if(Math.abs(a.x-px)<32&&Math.abs(a.y-350)<55){score=0;speed=4;cars.forEach((z,i)=>z.y=-i*120-60)}});document.getElementById('score').textContent='Distance: '+score;x.fillStyle='#07101a';x.fillRect(0,0,520,420);x.fillStyle='#202b3b';x.fillRect(140,0,240,420);x.strokeStyle='#71809a';x.setLineDash([25,25]);x.lineWidth=4;x.lineDashOffset=-score*2;x.beginPath();x.moveTo(260,0);x.lineTo(260,420);x.stroke();x.setLineDash([]);x.fillStyle='#22d3ee';x.fillRect(px-18,335,36,58);x.fillStyle='#ff4d8d';cars.forEach(a=>x.fillRect(a.x-18,a.y,36,58))},16)}
function aim(){const c=canvas(600,420),x=c.getContext('2d');let target={x:100,y:100},hits=0,start=performance.now(),shots=0;function move(){target={x:35+Math.random()*530,y:45+Math.random()*330}}c.onclick=e=>{shots++;const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*c.width/r.width,my=(e.clientY-r.top)*c.height/r.height;if(Math.hypot(mx-target.x,my-target.y)<30){hits++;move()}document.getElementById('score').textContent='Hits: '+hits+' • Accuracy: '+Math.round(hits/shots*100)+'%'};timer=setInterval(()=>{x.fillStyle='#07101c';x.fillRect(0,0,600,420);x.strokeStyle='#1e3350';for(let i=0;i<600;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,420);x.stroke()}x.strokeStyle='#ff4d8d';x.beginPath();x.arc(target.x,target.y,30,0,7);x.stroke();x.beginPath();x.arc(target.x,target.y,12,0,7);x.stroke()},30);move()}
function block(){const c=canvas(420,420),x=c.getContext('2d'),n=8,cell=48,a=Array(n*n).fill(0);let color=0;function draw(){x.fillStyle='#08101d';x.fillRect(0,0,420,420);for(let i=0;i<a.length;i++){x.fillStyle=a[i]?'#7c5cff':'#142238';x.fillRect((i%n)*cell+2,Math.floor(i/n)*cell+2,44,44)}}c.onclick=e=>{const r=c.getBoundingClientRect(),cx=Math.floor((e.clientX-r.left)*420/r.width/cell),cy=Math.floor((e.clientY-r.top)*420/r.height/cell),i=cy*n+cx;if(cx<0||cy<0||cx>=n||cy>=n)return;a[i]=1;for(let row=0;row<n;row++)if(a.slice(row*n,row*n+n).every(Boolean))a.splice(row*n,n,...Array(n).fill(0));for(let col=0;col<n;col++)if(Array.from({length:n},(_,r)=>a[r*n+col]).every(Boolean))for(let r=0;r<n;r++)a[r*n+col]=0;draw()};draw()}
function golf(){const c=canvas(620,400),x=c.getContext('2d');let ball={x:70,y:330,vx:0,vy:0},hole={x:540,y:70},aiming=false;function reset(){ball={x:70,y:330,vx:0,vy:0}}c.onpointerdown=e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*620/r.width,my=(e.clientY-r.top)*400/r.height;if(Math.hypot(mx-ball.x,my-ball.y)<30){aiming=true}};c.onpointerup=e=>{if(!aiming)return;const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*620/r.width,my=(e.clientY-r.top)*400/r.height,dx=ball.x-mx,dy=ball.y-my;ball.vx=Math.max(-10,Math.min(10,dx*.06));ball.vy=Math.max(-10,Math.min(10,dy*.06));aiming=false};timer=setInterval(()=>{ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.985;ball.vy*=.985;if(ball.x<15||ball.x>605)ball.vx*=-.8;if(ball.y<15||ball.y>385)ball.vy*=-.8;if(Math.hypot(ball.x-hole.x,ball.y-hole.y)<18&&Math.hypot(ball.vx,ball.vy)<2){document.getElementById('score').textContent='Hole complete! Drag from the ball to shoot again.';ball.vx=ball.vy=0}x.fillStyle='#12301f';x.fillRect(0,0,620,400);x.fillStyle='#0a0d12';x.beginPath();x.arc(hole.x,hole.y,14,0,7);x.fill();x.fillStyle='#f5f7fb';x.beginPath();x.arc(ball.x,ball.y,11,0,7);x.fill()},16)}
function drift(){const c=canvas(620,400),x=c.getContext('2d');let px=310,py=200,ang=0,s=0,keys={};keysGame(e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r'){px=310;py=200;s=0}});document.onkeyup=e=>keys[e.key.toLowerCase()]=false;timer=setInterval(()=>{if(keys.a||keys.arrowleft)ang-=.06;if(keys.d||keys.arrowright)ang+=.06;let sp=(keys.w||keys.arrowup)?4:0;px+=Math.cos(ang)*sp;py+=Math.sin(ang)*sp;if(px<45||px>575||py<45||py>355){px=310;py=200;s=0}if(Math.random()<.03)s++;document.getElementById('score').textContent='Checkpoints: '+s;x.fillStyle='#08111c';x.fillRect(0,0,620,400);x.strokeStyle='#26364d';x.lineWidth=35;x.strokeRect(30,30,560,340);x.strokeStyle='#162437';x.lineWidth=2;x.strokeRect(48,48,524,324);x.save();x.translate(px,py);x.rotate(ang);x.fillStyle='#22d3ee';x.fillRect(-22,-11,44,22);x.restore()},16)}
function switcher(){const c=canvas(500,500),x=c.getContext('2d');let y=430,vy=-4,score=0,gate=0,colors=['#22d3ee','#ff4d8d','#facc15','#7c5cff'];function jump(){if(y>410)vy=-8}c.onclick=jump;keysGame(e=>{if(e.code==='Space'||e.key==='ArrowUp')jump();if(e.key.toLowerCase()==='r'){y=430;vy=-4;score=0;gate=0}});timer=setInterval(()=>{y+=vy;vy+=.35;gate+=2;if(gate>520){gate=0;score++;}if(y<20)y=20;if(y>450){y=430;vy=-4;score=0}document.getElementById('score').textContent='Score: '+score;x.fillStyle='#080d17';x.fillRect(0,0,500,500);let col=colors[score%4];x.fillStyle=col;x.fillRect(0,0,500,45);x.fillStyle='#22d3ee';x.beginPath();x.arc(250,y,13,0,7);x.fill();x.fillStyle=colors[(score+1)%4];x.fillRect(0,270,gate,35);x.fillRect(gate+120,270,500-gate-120,35)},16)}
function stack(){const c=canvas(500,500),x=c.getContext('2d');let blocks=[],cur={x:150,w:200,dir:1},score=0;function reset(){blocks=[];cur={x:150,w:200,dir:1};score=0}function drop(){let below=blocks[blocks.length-1],left=below?Math.max(cur.x,below.x):cur.x,right=below?Math.min(cur.x+cur.w,below.x+below.w):cur.x+cur.w,w=right-left;if(w<=0)return reset();blocks.push({x:left,w,y:440-blocks.length*28});cur={x:0,w,dir:1};score++}c.onclick=drop;keysGame(e=>{if(e.code==='Space'||e.key==='ArrowUp')drop();if(e.key.toLowerCase()==='r')reset()});timer=setInterval(()=>{cur.x+=cur.dir*4;if(cur.x<0||cur.x+cur.w>500)cur.dir*=-1;document.getElementById('score').textContent='Height: '+score;x.fillStyle='#070d17';x.fillRect(0,0,500,500);x.fillStyle='#18263a';blocks.forEach(b=>x.fillRect(b.x,b.y,b.w,25));x.fillStyle='#22d3ee';x.fillRect(cur.x,440-blocks.length*28,cur.w,25)},16)}
function switcherAlias(){}
const switcher2=switcher;
const switcherRef=switcher;
function switcherGame(){}
const switcherFn=switcher;
function switcherWrapper(){switcher()}
function switcherName(){switcher()}
function switcher(){const c=canvas(500,500),x=c.getContext('2d');let y=430,vy=-4,score=0,gate=0,colors=['#22d3ee','#ff4d8d','#facc15','#7c5cff'];function jump(){if(y>410)vy=-8}c.onclick=jump;keysGame(e=>{if(e.code==='Space'||e.key==='ArrowUp')jump();if(e.key.toLowerCase()==='r'){y=430;vy=-4;score=0;gate=0}});timer=setInterval(()=>{y+=vy;vy+=.35;gate+=2;if(gate>520){gate=0;score++;}if(y<20)y=20;if(y>450){y=430;vy=-4;score=0}document.getElementById('score').textContent='Score: '+score;x.fillStyle='#080d17';x.fillRect(0,0,500,500);x.fillStyle=colors[score%4];x.fillRect(0,0,500,45);x.fillStyle='#22d3ee';x.beginPath();x.arc(250,y,13,0,7);x.fill();x.fillStyle=colors[(score+1)%4];x.fillRect(0,270,gate,35);x.fillRect(gate+120,270,500-gate-120,35)},16)}
</script>
</body></html>
