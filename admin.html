<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArcadeHub Admin</title><style>body{margin:0;background:#080d17;color:#f5f7fb;font-family:system-ui;padding:24px}.wrap{max-width:850px;margin:auto}.card{background:#111a29;border:1px solid #26344a;border-radius:18px;padding:20px;margin:14px 0}button,input,select{background:#182437;color:#fff;border:1px solid #33445c;border-radius:10px;padding:10px;margin:5px 0}button{cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#93a4bd}a{color:#7dd3fc}</style></head><body><div id="gate" style="position:fixed;inset:0;background:#080d17;display:flex;align-items:center;justify-content:center;z-index:9"><div class="card" style="width:min(380px,90%)"><h2>Admin access</h2><p class="muted">Enter the admin password.</p><input id="pw" type="password" placeholder="Password" style="width:100%"><button onclick="login()">Continue</button><p id="err"></p></div></div><div class="wrap" id="panel" style="display:none"><a href="/">← Back to ArcadeHub</a><h1>Admin Panel</h1><p class="muted">Local admin controls for this browser. For production authentication, connect this panel to a server-side auth system.</p><div class="card"><h2>Site controls</h2><div class="row"><button onclick="toggle()">Toggle maintenance mode</button><button onclick="reset()">Reset local settings</button></div><p id="status"></p></div><div class="card"><h2>Announcement</h2><input id="ann" style="width:80%" placeholder="Write an announcement…"><button onclick="save()">Save</button><p id="saved"></p></div><div class="card"><h2>Quick actions</h2><div class="row"><button onclick="location.href='/'">Open game site</button><button onclick="alert('All game code is client-side and requires no server process.')">System info</button></div></div></div><script>const ADMIN_PASSWORD='arcade-admin-4729';function login(){if(document.getElementById('pw').value===ADMIN_PASSWORD){sessionStorage.setItem('arcade-admin','1');document.getElementById('gate').style.display='none';document.getElementById('panel').style.display='block'}else document.getElementById('err').textContent='Incorrect password.'}if(sessionStorage.getItem('arcade-admin')==='1'){document.getElementById('gate').style.display='none';document.getElementById('panel').style.display='block'}function show(){document.getElementById('status').textContent=localStorage.getItem('maintenance')==='1'?'Maintenance mode: ON':'Maintenance mode: OFF'}function toggle(){localStorage.setItem('maintenance',localStorage.getItem('maintenance')==='1'?'0':'1');show()}function reset(){localStorage.clear();show();document.getElementById('saved').textContent='Settings reset.'}function save(){localStorage.setItem('announcement',document.getElementById('ann').value);document.getElementById('saved').textContent='Saved locally.'}document.getElementById('ann').value=localStorage.getItem('announcement')||'';show()</script></body></html>
