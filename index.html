<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoundBox — 240+ Gekke Geluiden</title><meta name="theme-color" content="#090b12"><style>:root{--bg:#090b12;--p:#121622;--p2:#191e2c;--line:#2a3142;--txt:#f7f8fc;--muted:#9aa4b5;--a:#8b5cf6;--b:#22d3ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#25134d,transparent 35%),radial-gradient(circle at 90% 15%,#063b48,transparent 28%),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1250px;margin:auto;padding:28px 18px 55px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,var(--a),var(--b));font-size:25px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.15em;color:#bca9ff;text-transform:uppercase}.hero h1{font-size:clamp(32px,6vw,54px);line-height:1;margin:5px 0 0;letter-spacing:-.05em}.hero p{color:var(--muted);margin:12px 0 0}.stats{text-align:right;color:var(--muted);font-size:13px}.stats strong{color:var(--txt)}.toolbar{position:sticky;top:8px;z-index:5;display:flex;gap:9px;flex-wrap:wrap;padding:11px;background:#0e1119e8;backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:17px}.search{position:relative;flex:1;min-width:220px}.search span{position:absolute;left:14px;top:9px;color:var(--muted);font-size:19px}.search input,.toolbar select,.tool{height:43px;border:1px solid var(--line);border-radius:11px;background:var(--p);color:var(--txt);outline:0}.search input{width:100%;padding:0 14px 0 40px}.search input:focus{border-color:var(--a);box-shadow:0 0 0 3px #8b5cf622}.toolbar select{padding:0 12px}.tool{padding:0 13px;cursor:pointer}.tool:hover,.tool.active{border-color:var(--a);background:#281d43}.vol{height:43px;display:flex;align-items:center;gap:7px;padding:0 10px;border:1px solid var(--line);border-radius:11px;color:var(--muted);background:var(--p)}.vol input{accent-color:var(--a);width:90px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;margin-top:18px}.card{position:relative;min-height:125px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,var(--p),#0e1119);color:var(--txt);cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#596378;background:var(--p2)}.card.playing{border-color:var(--a);box-shadow:0 0 0 1px #8b5cf655,0 12px 40px #7c3aed22}.icon{font-size:28px;margin-bottom:9px}.name{font-weight:750;padding-right:30px}.cat{font-size:11px;color:var(--muted);margin-top:5px}.fav{position:absolute;right:9px;top:8px;width:32px;height:32px;border:0;background:transparent;color:#697386;font-size:20px;cursor:pointer}.fav.on{color:#facc15}.hint{position:absolute;right:12px;bottom:10px;color:#687286;font-size:11px}.empty{text-align:center;color:var(--muted);padding:65px 10px}.footer{text-align:center;color:#687286;font-size:12px;margin-top:27px}@media(max-width:650px){.hero{align-items:start}.stats{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{min-height:116px;padding:12px}.vol{width:100%;justify-content:center}.vol input{flex:1;max-width:230px}}</style></head><body><div class="wrap"><header class="hero"><div><div class="brand"><div class="logo">🔊</div><div><div class="eyebrow">SoundBox</div><h1>Press. Hear. Chaos.</h1></div></div><p>240+ gekke geluiden. Zoek, druk, favoriet en maak herrie.</p></div><div class="stats"><strong id="total">240+</strong> geluiden<br><span id="fc">0</span> favorieten</div></header><section class="toolbar"><div class="search"><span>⌕</span><input id="q" placeholder="Zoek een geluid… bijvoorbeeld fart, laser, meme"></div><select id="cat"><option value="all">Alle categorieën</option></select><button class="tool" id="fav">★ Favorieten</button><button class="tool" id="rand">🎲 Random</button><button class="tool" id="stop">■ Stop</button><div class="vol">🔉 <input id="volume" type="range" min="0" max="100" value="70"><b id="vt">70%</b></div></section><main id="grid" class="grid"></main><div id="empty" class="empty" hidden>Geen geluiden gevonden.</div><div class="footer">Klik op een knop om te spelen • Favorieten worden op dit apparaat opgeslagen • Web Audio werkt zonder downloads</div></div><script>
const groups={

const extra=['Banana Slip','Rubber Chicken','Dramatic Sting','Spooky Whisper','Demon Growl','Tiny Scream','Mega Scream','Duck Army','Goofy Honk','Boiler Hiss','Pressure Release','Potion Fizz','Arcade Blip','Arcade Zap','8-Bit Jump','8-Bit Coin','8-Bit Death','Bass Drop','Subwoofer Thump','Heartbeat Fast','Heartbeat Slow','Static Burst','Radio Static','Dial Tone','Busy Tone','Elevator Ding','Cash Register','Buzzer','Wrong Answer','Correct Answer','Level Failed','Victory Fanfare','Tiny Violin','Sad Violin','Suspense','Horror Sting','Jumpscare','Creepy Laugh','Ghost Moan','Monster Roar','Dragon Roar','Dinosaur Roar','Shark Chomp','Snake Hiss','Bee Buzz','Mosquito','Fly Buzz','Owl Swoop','Space Laser','Meteor','Black Hole','Rocket Launch','Rocket Whoosh','Jet Flyby','Helicopter','Engine Rev','Turbo','Nitro','Clown Horn','Party Popper','Confetti','Kiss','Slurp','Crunch','Munch','Chewing','Sip','Gulp','Cough','Sneeze','Hiccup','Snore','Clap Single','Finger Snap','Whistle','Finger Whistle','Shush','Boo','Cheer','Crowd Gasp','Crowd Laugh','Crowd Shock','Drum Roll','Big Drum Hit','Gong','Triangle','Maraca','Cowbell','Kazoo','Harmonica','Flute Fail','Piano Plonk','Guitar Twang','Violin Squeak','DJ Airhorn','Bass Wobble','Synth Rise','Synth Fall','Dubstep Wobble','Retro Jump','Retro Hit','Game Beep','Game Blip','Menu Select','Menu Back','Quest Complete','Boss Warning','Boss Defeat','Portal Glitch','Hologram','Scanner Beam','Force Field','Electric Arc','Tesla Zap','Power Down','Power Up','Battery Low','Battery Full','USB Connect','USB Disconnect','Wi-Fi Connect','Wi-Fi Error','Message Pop','Phone Ring','Phone Vibrate','Camera Flash','Video Start','Video Stop','Typing','Keyboard Enter','Page Flip','Paper Rip','Pen Click','Stapler','School Bell','Fire Alarm','Security Alarm','Radar Ping','Submarine Ping','Morse Code','Echo Clap','Echo Shout','Megaphone','Meme Combo','Chaos Button','Absolutely Not','Bruh 2','Bonk 2','Vine Boom 2','Airhorn 2','Fart Combo','Ultimate Fart','Mega Burp','Cat Explosion','Goat Mode','Random Nonsense','???','Why','Bro What','Certified Goofy','Suspicious','Amongus-ish','Brainrot Ping','Ohio Alarm','NPC Beep','Side Eye','Ayo','Let Him Cook','Cooked','Get Out','Skill Issue','Womp Womp','Clown Moment','Plot Twist','To Be Continued','Dramatic Gasp','Instant Regret','Mission Accomplished','Critical Hit','Critical Fail','Rare Drop','Legendary Drop','Secret Sound','Hidden Noise','Final Boss','End Of The Universe'];
let sounds=[],n=0;for(const [cat,names] of Object.entries(groups))for(const name of names)sounds.push({id:n++,name,cat,emoji:{Memes:'😂','Farts & Burps':'💨',Animals:'🐸','Sci-Fi':'👽',Cartoon:'🎨',Nature:'🌩️',Machines:'⚙️',Voices:'🗣️',Glitches:'🌀',Misc:'✨'}[cat],i:n});extra.forEach((name,i)=>sounds.push({id:n++,name,cat:i%2?'Misc':'Memes',emoji:i%2?'✨':'🤪',i:i+50}));
const favs=new Set(JSON.parse(localStorage.getItem('soundbox-favs')||'[]').map(Number));let state={q:'',cat:'all',onlyFav:false,playing:null,vol:.7};const grid=document.querySelector('#grid');for(const c of Object.keys(groups)){let o=document.createElement('option');o.value=c;o.textContent=c;document.querySelector('#cat').append(o)}document.querySelector('#total').textContent=sounds.length+'+';
function render(){let q=state.q.toLowerCase().trim();let list=sounds.filter(s=>(state.cat==='all'||s.cat===state.cat)&&(!state.onlyFav||favs.has(s.id))&&(!q||(s.name+' '+s.cat).toLowerCase().includes(q)));grid.innerHTML='';document.querySelector('#empty').hidden=!!list.length;list.forEach(s=>{let b=document.createElement('div');b.className='card'+(state.playing===s.id?' playing':'');b.innerHTML=`<button class="fav ${favs.has(s.id)?'on':''}">★</button><div class="icon">${s.emoji}</div><div class="name">${esc(s.name)}</div><div class="cat">${esc(s.cat)}</div><div class="hint">▶ play</div>`;b.onclick=e=>{if(e.target.classList.contains('fav'))return;play(s)};b.querySelector('.fav').onclick=e=>{e.stopPropagation();favs.has(s.id)?favs.delete(s.id):favs.add(s.id);localStorage.setItem('soundbox-favs',JSON.stringify([...favs]));render()};grid.append(b)});document.querySelector('#fc').textContent=favs.size;document.querySelector('#fav').classList.toggle('active',state.onlyFav)}function esc(x){return x.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let ctx,master,active=[];function ac(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();master.gain.value=state.vol;return ctx}function osc(c,type,f,d=.3,g=.18,delay=0,end){let o=c.createOscillator(),gn=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+delay);if(end)o.frequency.exponentialRampToValueAtTime(Math.max(20,end),c.currentTime+delay+d);gn.gain.setValueAtTime(.0001,c.currentTime+delay);gn.gain.exponentialRampToValueAtTime(g,c.currentTime+delay+.012);gn.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+d);o.connect(gn).connect(master);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d+.03);active.push(o)}function noise(c,d=.35,g=.2,cut=1200){let b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;let s=c.createBufferSource(),f=c.createBiquadFilter(),gn=c.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;gn.gain.setValueAtTime(g,c.currentTime);gn.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);s.connect(f).connect(gn).connect(master);s.start();active.push(s)}
function play(s){stop(false);let c=ac(),x=s.name.toLowerCase(),i=s.i;state.playing=s.id;render();if(x.includes('fart')){noise(c,.65,.34,420);osc(c,'sine',75,.55,.14,0,45)}else if(x.includes('burp')){osc(c,'sawtooth',90,.7,.22,0,45);noise(c,.3,.1,650)}else if(x.includes('laser')||x.includes('zap')||x.includes('electric')){osc(c,'sawtooth',700,.35,.23,0,65);osc(c,'square',1300,.18,.11,.02,90)}else if(x.includes('boom')||x.includes('explosion')||x.includes('thump')||x.includes('meteor')){noise(c,.8,.42,500);osc(c,'sine',75,.65,.3,0,28)}else if(x.includes('siren')){for(let k=0;k<3;k++){osc(c,'sawtooth',500,.32,.12,k*.32,900);osc(c,'sawtooth',900,.32,.12,k*.32+.16,500)}}else if(['cat','dog','wolf','fox','cow','goat','pig','horse','donkey','chicken','rooster','duck','frog','crow','owl','monkey','snake','bee','mosquito','fly','dinosaur','dragon','shark'].some(z=>x.includes(z))){let f=90+(i%9)*42;osc(c,'triangle',f,.35,.22,0,f*1.8);osc(c,'sawtooth',f*1.5,.25,.1,.1,f*.55)}else if(x.includes('thunder')||x.includes('rumble')||x.includes('avalanche')){noise(c,1.1,.35,300);osc(c,'sine',55,1,.2,0,30)}else if(x.includes('rain')||x.includes('wind')||x.includes('static')||x.includes('hiss'))noise(c,.8,.2,x.includes('wind')?700:1800);else if(x.includes('glitch')||x.includes('error')||x.includes('sus')||x.includes('brainrot')||x.includes('nonsense')){for(let k=0;k<7;k++)osc(c,['square','sawtooth','triangle'][k%3],120+(i*37+k*181)%1700,.06,.13,k*.055,80+(k*97)%600)}else if(x.includes('boing')||x.includes('spring'))osc(c,'sine',180,.55,.25,0,700);else if(x.includes('whoosh')||x.includes('swish'))noise(c,.55,.2,2200);else if(x.includes('bell')||x.includes('ding')||x.includes('coin')||x.includes('ping')||x.includes('achievement')||x.includes('correct')){osc(c,'sine',880,.45,.2);osc(c,'sine',1320,.55,.12,.08)}else if(x.includes('alarm')||x.includes('buzzer')||x.includes('wrong')){osc(c,'square',220,.18,.18);osc(c,'square',165,.18,.18,.2)}else if(x.includes('heartbeat')){osc(c,'sine',65,.14,.24);osc(c,'sine',65,.14,.2,.22)}else if(x.includes('whistle')||x.includes('flute'))osc(c,'sine',700+(i%5)*120,.65,.17,0,1100);else if(x.includes('horn')||x.includes('honk')){osc(c,'sawtooth',180,.32,.2,0,130);osc(c,'square',270,.28,.1,.02,190)}else if(x.includes('phone')||x.includes('ring')){osc(c,'sine',620,.22,.16);osc(c,'sine',880,.22,.13,.25)}else if(x.includes('laugh')||x.includes('scream')||x.includes('voice')||x.includes('shout')||x.includes('cheer'))for(let k=0;k<4;k++)osc(c,'sawtooth',150+(i%10)*18,.18,.1,k*.12,260+(i%6)*35);else if(x.includes('scratch')){noise(c,.45,.3,3200);osc(c,'sawtooth',150,.3,.12,0,40)}else if(x.includes('drop')||x.includes('fall')||x.includes('power down'))osc(c,'sawtooth',900,.7,.2,0,55);else if(x.includes('up')||x.includes('level')||x.includes('victory')){osc(c,'square',260,.18,.13);osc(c,'square',390,.18,.13,.16);osc(c,'square',590,.3,.13,.32)}else if(x.includes('pop')||x.includes('bubble')||x.includes('snap')){osc(c,'sine',900,.08,.25,0,120);noise(c,.08,.1,5000)}else if(x.includes('crunch')||x.includes('munch')||x.includes('slurp')||x.includes('gulp'))noise(c,.3,.24,2600);else if(x.includes('drum')||x.includes('clap')||x.includes('applause')){noise(c,.2,.3,9000);osc(c,'sine',120,.18,.2,0,70)}else{let type=['sine','triangle','square','sawtooth'][i%4],f=140+(i*83)%900;osc(c,type,f,.42,.2,0,f*(i%2?2.2:.45));if(i%3===0)osc(c,'sine',f*1.5,.3,.08,.06,f)}setTimeout(()=>{state.playing=null;render()},900)}function stop(r=true){active.forEach(o=>{try{o.stop()}catch{}});active=[];state.playing=null;if(r)render()}
document.querySelector('#q').oninput=e=>{state.q=e.target.value;render()};document.querySelector('#cat').onchange=e=>{state.cat=e.target.value;render()};document.querySelector('#fav').onclick=()=>{state.onlyFav=!state.onlyFav;render()};document.querySelector('#rand').onclick=()=>{let a=sounds.filter(s=>(state.cat==='all'||s.cat===state.cat)&&(!state.onlyFav||favs.has(s.id)));if(a.length)play(a[Math.floor(Math.random()*a.length)])};document.querySelector('#stop').onclick=()=>stop();document.querySelector('#volume').oninput=e=>{state.vol=+e.target.value/100;document.querySelector('#vt').textContent=e.target.value+'%';if(master)master.gain.value=state.vol};window.onkeydown=e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();document.querySelector('#rand').click()}if(e.key.toLowerCase()==='f')document.querySelector('#fav').click()};render();</script></body></html>
