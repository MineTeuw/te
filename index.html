<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade Hub</title>
<style>
:root{--bg:#070b14;--card:#101827;--card2:#151f31;--line:#26344a;--text:#f5f7fb;--muted:#93a4bd;--accent:#7c5cff;--accent2:#21d4fd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#182b52,transparent 34%),radial-gradient(circle at 90% 10%,#25164b,transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}
.wrap{max-width:1200px;margin:auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:34px}.brand{font-weight:900;font-size:24px}.brand span{color:var(--accent2)}.admin{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:10px 14px;border-radius:12px;background:#0f1725}.hero{padding:26px 0}.eyebrow{color:#9e8cff;font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-size:clamp(38px,7vw,72px);line-height:.95;margin:8px 0 14px}.hero p{color:var(--muted);max-width:650px;font-size:17px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:12px;border:1px solid var(--line);background:#0c1320dd;backdrop-filter:blur(14px);border-radius:16px;position:sticky;top:10px;z-index:5}.toolbar input,.toolbar button{height:42px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);padding:0 13px}.toolbar input{flex:1;min-width:220px;outline:0}.toolbar button{cursor:pointer}.toolbar button.active,.toolbar button:hover{border-color:var(--accent);background:#211a42}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:18px}.game{border:1px solid var(--line);background:linear-gradient(145deg,var(--card),#0c1320);border-radius:18px;padding:18px;min-height:175px;display:flex;flex-direction:column}.icon{font-size:42px}.game h2{font-size:19px;margin:9px 0 5px}.game p{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 14px}.play{margin-top:auto;border:0;border-radius:11px;padding:10px 13px;background:linear-gradient(135deg,var(--accent),#5d8cff);color:#fff;font-weight:800;cursor:pointer}.foot{color:var(--muted);text-align:center;padding-top:34px;font-size:12px}
#modal{display:none;position:fixed;inset:0;background:#02050bd9;z-index:20;padding:18px;align-items:center;justify-content:center}.box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0d1522;border:1px solid var(--line);border-radius:20px;padding:20px;position:relative}.close{position:absolute;right:14px;top:12px;background:#1a2535;border:1px solid var(--line);color:white;border-radius:10px;padding:7px 10px;cursor:pointer}.stage{min-height:350px;display:grid;place-items:center;margin-top:12px}.score{font-size:20px;margin:8px 0 14px}.smallbtn{background:#182437;color:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}.board{display:grid;gap:5px}.cell{width:52px;height:52px;border:1px solid #33435b;background:#162238;border-radius:7px;color:#fff;font-size:24px;cursor:pointer}.memory{grid-template-columns:repeat(4,62px)}.memory .cell{width:62px;height:62px}.tap{width:220px;height:220px;border-radius:50%;border:0;background:#243650;color:#fff;font-size:20px;cursor:pointer}.tap.go{background:#22c55e}.gamecanvas{background:#050a12;border:1px solid var(--line);border-radius:12px;touch-action:none}.typing{width:100%;background:#111d2d;border:1px solid var(--line);color:white;border-radius:10px;padding:13px;outline:0}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand">Arcade<span>Hub</span></div></header>
<section class="hero"><div class="eyebrow">Browser games</div><h1>Play something.</h1><p>Ten lightweight games that run directly in your browser. No downloads, no accounts, no external game sites.</p></section>
<section class="toolbar"><input id="search" placeholder="Search games…"><button data-cat="all" class="active">All</button><button data-cat="arcade">Arcade</button><button data-cat="puzzle">Puzzle</button><button data-cat="skill">Skill</button></section>
<main id="grid" class="grid"></main><div class="foot">ArcadeHub • Games are built into this site.</div></div>
<div id="modal"><div class="box"><button class="close" onclick="closeGame()">Close</button><h2 id="title"></h2><div id="stage" class="stage"></div></div></div>
<script>
const games=[
['snake','🐍','Snake','Arcade','Guide the snake, eat food and avoid yourself.'],
['2048','🔢','2048','Puzzle','Combine matching tiles until you reach 2048.'],
['mines','💣','Minesweeper','Puzzle','Clear the board without hitting a mine.'],
['ttt','⭕','Tic-Tac-Toe','Puzzle','Classic three-in-a-row against the computer.'],
['flappy','🐤','Flappy','Arcade','Tap or press Space to fly through the gaps.'],
['breakout','🧱','Breakout','Arcade','Bounce the ball and clear every brick.'],
['memory','🧠','Memory Match','Puzzle','Find all matching pairs.'],
['reaction','⚡','Reaction Test','Skill','Wait for green, then click as fast as you can.'],
['whack','🔨','Whack-a-Mole','Skill','Hit the target as many times as possible in 30 seconds.'],
['typing','⌨️','Typing Speed','Skill','Type the displayed sentence and test your speed.']
];
const grid=document.getElementById('grid');let cat='all';
function draw(){let q=document.getElementById('search').value.toLowerCase();grid.innerHTML=games.filter(g=>(cat==='all'||g[3].toLowerCase()===cat)&&g[2].toLowerCase().includes(q)).map(g=>`<article class="game"><div class="icon">${g[1]}</div><h2>${g[2]}</h2><p>${g[4]}</p><button class="play" onclick="openGame('${g[0]}','${g[2]}')">Play</button></article>`).join('')}
document.getElementById('search').oninput=draw;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()});draw();
const modal=document.getElementById('modal'),stage=document.getElementById('stage'),title=document.getElementById('title');let timer;
function openGame(id,t){clearInterval(timer);title.textContent=t;stage.innerHTML='';modal.style.display='flex';({snake,game2048,mines,ttt,flappy,breakout,memory,reaction,whack,typing}[id])()}
function closeGame(){clearInterval(timer);modal.style.display='none'}
function btn(t,fn){let b=document.createElement('button');b.className='smallbtn';b.textContent=t;b.onclick=fn;return b}
function snake(){stage.innerHTML='<div><div class="score">Score: <b id="sc">0</b></div><canvas class="gamecanvas" width="360" height="360"></canvas><p>Use arrow keys or WASD.</p></div>';let c=stage.querySelector('canvas'),x=c.getContext('2d'),s=18,body=[{x:9,y:9}],d={x:1,y:0},food={x:4,y:6},score=0;function f(){x.fillStyle='#08101c';x.fillRect(0,0,360,360);x.fillStyle='#ff5577';x.fillRect(food.x*s,food.y*s,s-2,s-2);x.fillStyle='#7c5cff';body.forEach(p=>x.fillRect(p.x*s,p.y*s,s-2,s-2))}function loop(){let h={x:body[0].x+d.x,y:body[0].y+d.y};if(h.x<0||h.y<0||h.x>=20||h.y>=20||body.some(p=>p.x===h.x&&p.y===h.y)){body=[{x:9,y:9}];d={x:1,y:0};score=0;document.getElementById('sc').textContent=0;return f()}body.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.getElementById('sc').textContent=score;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}else body.pop();f()}document.onkeydown=e=>{let k=e.key.toLowerCase(),nd=k==='arrowup'||k==='w'?{x:0,y:-1}:k==='arrowdown'||k==='s'?{x:0,y:1}:k==='arrowleft'||k==='a'?{x:-1,y:0}:k==='arrowright'||k==='d'?{x:1,y:0}:null;if(nd&&!(nd.x===-d.x&&nd.y===-d.y)){d=nd;e.preventDefault()}};timer=setInterval(loop,110);f()}
function game2048(){let a=Array(16).fill(0);a[Math.floor(Math.random()*16)]=2;function add(){let e=a.map((v,i)=>v?{v,i}:null).filter(Boolean);if(!e.length)return;let z=e[Math.floor(Math.random()*e.length)].i;a[z]=a[z]?a[z]:2}function draw(){stage.innerHTML='<div><div class="board" style="grid-template-columns:repeat(4,70px)">'+a.map((v,i)=>'<button class="cell" style="width:70px;height:70px" onclick="void(0)">'+(v||'')+'</button>').join('')+'</div><p>Use arrow keys. Swipe is supported by the buttons only on desktop.</p></div>';document.onkeydown=e=>{let dir=e.key;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(dir))return;e.preventDefault();let rows=[];for(let r=0;r<4;r++)rows.push(a.slice(r*4,r*4+4));if(dir==='ArrowLeft'||dir==='ArrowRight')rows=rows.map(r=>dir==='ArrowRight'?r.reverse():r).map(r=>{r=r.filter(Boolean);for(let i=0;i<r.length-1;i++)if(r[i]===r[i+1]){r[i]*=2;r.splice(i+1,1)}while(r.length<4)r.push(0);return r}).map(r=>dir==='ArrowRight'?r.reverse():r);else{let cols=[];for(let c=0;c<4;c++)cols.push([a[c],a[c+4],a[c+8],a[c+12]]);cols=cols.map(r=>dir==='ArrowDown'?r.reverse():r).map(r=>{r=r.filter(Boolean);for(let i=0;i<r.length-1;i++)if(r[i]===r[i+1]){r[i]*=2;r.splice(i+1,1)}while(r.length<4)r.push(0);return r}).map(r=>dir==='ArrowDown'?r.reverse():r);for(let c=0;c<4;c++)for(let r=0;r<4;r++)a[r*4+c]=cols[c][r];add();return draw()}for(let r=0;r<4;r++)a.splice(r*4,4,...rows[r]);add();draw()}}draw()}
function mines(){let n=8,m=10,a=Array(n*n).fill(0),open=Array(n*n).fill(0);while(a.filter(x=>x===-1).length<m){let i=Math.floor(Math.random()*a.length);if(a[i]!==-1)a[i]=-1}for(let i=0;i<a.length;i++)if(a[i]!==-1){let c=0;for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){let X=i% n+x,Y=Math.floor(i/n)+y;if(X>=0&&X<n&&Y>=0&&Y<n&&a[Y*n+X]===-1)c++}a[i]=c}function draw(){stage.innerHTML='<div class="board" style="grid-template-columns:repeat(8,34px)">'+a.map((v,i)=>'<button class="cell" style="width:34px;height:34px;font-size:13px" onclick="mineClick('+i+')">'+(open[i]?(v===-1?'💣':v||''): '?')+'</button>').join('')+'</div>';window.mineClick=i=>{if(a[i]===-1){open.fill(1);alert('Boom!');}else open[i]=1;draw()}}draw()}
function ttt(){let a=Array(9).fill('');function draw(){stage.innerHTML='<div><div class="board" style="grid-template-columns:repeat(3,52px)">'+a.map((v,i)=>'<button class="cell" onclick="move('+i+')">'+v+'</button>').join('')+'</div><p>First to three in a row wins.</p></div>';window.move=i=>{if(a[i])return;a[i]='X';if(win('X'))return draw(),alert('You win!');let e=a.map((v,j)=>v?null:j).filter(x=>x!==null);if(e.length){a[e[Math.floor(Math.random()*e.length)]]='O';if(win('O'))return draw(),alert('Computer wins.')}draw()}}function win(p){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(r=>r.every(i=>a[i]===p))}draw()}
function flappy(){stage.innerHTML='<div><div class="score">Score: <b id="fs">0</b></div><canvas class="gamecanvas" width="360" height="420"></canvas><p>Press Space / click to flap.</p></div>';let c=stage.querySelector('canvas'),x=c.getContext('2d'),y=200,v=0,px=60,score=0,pipe=360,gap=170;function jump(){v=-6}document.onkeydown=e=>{if(e.code==='Space'){jump();e.preventDefault()}};c.onclick=jump;timer=setInterval(()=>{v+=.3;y+=v;pipe-=2;if(pipe< -50){pipe=360;gap=100+Math.random()*190;score++;document.getElementById('fs').textContent=score}if(y<0||y>420||((px>pipe-22&&px<pipe+55)&&(y<gap||y>gap+120))){y=200;v=0;score=0;pipe=360;document.getElementById('fs').textContent=0}x.fillStyle='#07111f';x.fillRect(0,0,360,420);x.fillStyle='#60a5fa';x.fillRect(pipe,0,55,gap);x.fillRect(pipe,gap+120,55,420);x.fillStyle='#facc15';x.beginPath();x.arc(px,y,12,0,7);x.fill()},16)}
function breakout(){stage.innerHTML='<div><canvas class="gamecanvas" width="420" height="360"></canvas><p>Move with ← → or A/D.</p></div>';let c=stage.querySelector('canvas'),x=c.getContext('2d'),px=180,bx=210,by=290,vx=3,vy=-3,br=Array.from({length:30},(_,i)=>({x:(i%10)*41+5,y:20+Math.floor(i/10)*20,on:1}));document.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')px=Math.max(0,px-20);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')px=Math.min(360,px+20)};timer=setInterval(()=>{bx+=vx;by+=vy;if(bx<6||bx>414)vx*=-1;if(by<6)vy*=-1;if(by>350){bx=210;by=290;vy=-3}if(by>330&&bx>px&&bx<px+60)vy=-Math.abs(vy);br.forEach(b=>{if(b.on&&bx>b.x&&bx<b.x+38&&by>b.y&&by<b.y+18){b.on=0;vy*=-1}});x.fillStyle='#07111f';x.fillRect(0,0,420,360);x.fillStyle='#7c5cff';br.forEach(b=>b.on&&x.fillRect(b.x,b.y,38,17));x.fillStyle='#21d4fd';x.fillRect(px,340,60,8);x.fillStyle='#fff';x.beginPath();x.arc(bx,by,6,0,7);x.fill()},16)}
function memory(){let a=['🍎','🍎','🚀','🚀','🐸','🐸','⭐','⭐','🎮','🎮','🍕','🍕','⚽','⚽','👾','👾'].sort(()=>Math.random()-.5),open=[],lock=0;function draw(){stage.innerHTML='<div><div class="board memory">'+a.map((v,i)=>'<button class="cell" onclick="flip('+i+')">'+(open.includes(i)?v:'?')+'</button>').join('')+'</div></div>';window.flip=i=>{if(lock||open.includes(i))return;open.push(i);draw();if(open.length%2===0){lock=1;let z=open.slice(-2);if(a[z[0]]!==a[z[1]])setTimeout(()=>{open=open.filter(q=>!z.includes(q));lock=0;draw()},600);else lock=0}}}draw()}
function reaction(){stage.innerHTML='<div style="text-align:center"><div id="rt" class="tap">Wait…</div><p id="rtext">Click when it turns green.</p></div>';let t=document.getElementById('rt'),start;let delay=1000+Math.random()*3000;timer=setTimeout(()=>{t.classList.add('go');t.textContent='CLICK!';start=performance.now()},delay);t.onclick=()=>{if(!start){clearInterval(timer);t.textContent='Too early — try again';return}document.getElementById('rtext').textContent='Reaction: '+Math.round(performance.now()-start)+' ms';start=null}}
function whack(){stage.innerHTML='<div style="text-align:center"><div class="score">Time: <b id="wt">30</b> • Hits: <b id="wh">0</b></div><div id="hole" class="tap">🔨</div></div>';let hit=0,time=30,h=document.getElementById('hole');h.onclick=()=>{hit++;document.getElementById('wh').textContent=hit;move()};function move(){h.style.transform='translate('+((Math.random()-.5)*180)+'px,'+((Math.random()-.5)*180)+'px)';h.textContent=['🐹','🐸','👾','🎯'][Math.floor(Math.random()*4)]}timer=setInterval(()=>{time--;document.getElementById('wt').textContent=time;if(time<=0){clearInterval(timer);h.onclick=null;h.textContent='Done!'}},1000);move()}
function typing(){let text='The quick brown fox jumps over the lazy dog. Small games are fun.';stage.innerHTML='<div style="width:min(650px,100%)"><p style="font-size:18px;line-height:1.6">'+text+'</p><input class="typing" placeholder="Start typing here…"><p id="ty">WPM: 0</p></div>';let i=stage.querySelector('input'),s=0;i.oninput=()=>{if(!s)s=performance.now();let sec=(performance.now()-s)/1000,words=i.value.trim().split(/\s+/).filter(Boolean).length;document.getElementById('ty').textContent='WPM: '+Math.round(words/(sec/60)||0)+(i.value===text?' • Complete!':'')}}
</script></body></html>
